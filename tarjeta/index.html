  <script>
    // Mismo tema que el sitio: sigue al navegador salvo que la persona haya elegido otro.
    (function () {
      var saved = null, sys = 'light';
      try { saved = localStorage.getItem('qontrol-theme'); } catch (e) {}
      if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) sys = 'dark';
      var t = saved === 'dark' || saved === 'light' ? saved : sys;
      if (/[?&]tema=oscuro/.test(location.search)) t = 'dark';
      if (/[?&]tema=claro/.test(location.search)) t = 'light';
      document.documentElement.dataset.theme = t;
      document.documentElement.classList.add('js');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'dark' ? '#09090A' : '#F5F9FC');
    })();
  </script>

  <style>
    /* Tarjeta de presentación: una sola pantalla, la marca, el globo del sitio y dos botones. */
    body{min-height:100vh;min-height:100dvh;display:flex}
    .bc{flex:1;width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;
      padding:calc(env(safe-area-inset-top,0px) + 28px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(24px,env(safe-area-inset-left,0px))}
    .bc__top{display:flex;align-items:center;justify-content:space-between}
    .bc__top .theme{margin-left:0}
    .bc .hero__media{flex:1;min-height:300px;aspect-ratio:auto;margin:8px -24px 0}
    .bc__line{margin:0 0 24px;font-family:var(--font-display);font-size:clamp(26px,7.4vw,32px);line-height:1.1;letter-spacing:-.03em;color:var(--ink);text-wrap:balance}
    .bc__line span{color:var(--muted-text)}
    .bc__actions{display:grid;gap:10px}
    .bc__actions .btn{justify-content:center;height:56px;font-size:16px;border-radius:12px}
    .bc__foot{margin:20px 0 0;text-align:center;font-size:13px;color:var(--muted-text)}
  </style>
</head>

        <svg class="theme__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>

    </div>
    <p class="bc__foot">qontrolab.site</p>

  <script src="../assets/js/site.js?v=20261126-d"></script>
